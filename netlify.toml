[build]
  command = "bash build.sh"
  publish = "public"
  functions = "functions"

[build.environment]
  PYTHON_VERSION = "3.9"
  FLASK_APP = "main.py"
  FLASK_ENV = "production"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200 